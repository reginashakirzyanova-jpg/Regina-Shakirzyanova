<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17324d">
  <title>Safe, Smart, Ready — Library Safety</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #17324d;
      --blue: #2878a8;
      --mint: #c9f0df;
      --cream: #fff8e9;
      --ink: #17212b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      color: var(--ink);
      background: linear-gradient(145deg, #dcebf5, #f8f2e5);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 900px); }
    .player {
      overflow: hidden;
      border: 5px solid white;
      border-radius: 24px;
      background: var(--cream);
      box-shadow: 0 18px 55px #17324d2b;
    }
    .screen {
      min-height: 460px;
      display: grid;
      grid-template-columns: minmax(180px, 0.8fr) 1.2fr;
      align-items: center;
      gap: clamp(1rem, 5vw, 3.5rem);
      padding: clamp(1.5rem, 6vw, 4rem);
      background: radial-gradient(circle at 18% 22%, #ffffff 0 8%, transparent 8.5%), linear-gradient(135deg, var(--cream), #f0f8f3);
    }
    .art {
      display: grid;
      place-items: center;
      min-height: 220px;
      border-radius: 28px;
      background: var(--mint);
      font-size: clamp(5rem, 15vw, 9rem);
      animation: arrive .45s ease-out both;
    }
    .copy { animation: arrive .45s ease-out both; }
    .eyebrow { color: var(--blue); font-size: .85rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: .4rem 0 1rem; color: var(--navy); font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.05; }
    .caption { max-width: 42rem; margin: 0; font-size: clamp(1.1rem, 2.4vw, 1.45rem); line-height: 1.55; }
    .controls { padding: 1rem clamp(1rem, 4vw, 2rem) 1.25rem; background: white; }
    .progress-track { height: 8px; overflow: hidden; border-radius: 99px; background: #e6edf2; }
    .progress { width: 0; height: 100%; background: var(--blue); transition: width .25s ease; }
    .control-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-top: 1rem; }
    .buttons { display: flex; flex-wrap: wrap; gap: .5rem; }
    button { min-height: 44px; padding: .65rem 1rem; border: 0; border-radius: 12px; color: white; background: var(--navy); font: inherit; font-weight: 700; cursor: pointer; }
    button.secondary { color: var(--navy); background: #e8f0f5; }
    button:hover { filter: brightness(1.12); }
    button:focus-visible { outline: 3px solid #e3a72f; outline-offset: 3px; }
    #sceneCount { color: #485968; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .note { margin: .9rem 0 0; color: #485968; font-size: .9rem; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @keyframes arrive { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 620px) {
      .screen { min-height: 0; grid-template-columns: 1fr; gap: 1.25rem; }
      .art { min-height: 145px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="player" aria-label="School library safety video">
      <section class="screen" aria-live="polite" aria-atomic="true">
        <div class="art" id="art" aria-hidden="true">📚</div>
        <div class="copy">
          <div class="eyebrow" id="eyebrow">A quick safety guide</div>
          <h1 id="title">Safe, Smart, Ready</h1>
          <p class="caption" id="caption">A few simple habits help everyone feel welcome and safe in our school library. Let’s get started.</p>
        </div>
      </section>
      <div class="controls">
        <div class="progress-track" role="progressbar" aria-label="Video progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress" id="progress"></div></div>
        <div class="control-row">
          <div class="buttons">
            <button type="button" class="secondary" id="back" aria-label="Previous scene">← Back</button>
            <button type="button" id="play" aria-label="Play video">▶ Play</button>
            <button type="button" class="secondary" id="next" aria-label="Next scene">Next →</button>
            <button type="button" class="secondary" id="audio" aria-pressed="false">🔊 Narration off</button>
          </div>
          <span id="sceneCount" aria-live="polite">Scene 1 of 7</span>
        </div>
        <p class="note">Use the buttons or ← / → keys. Narration uses your browser’s voice and can be turned off anytime.</p>
      </div>
    </div>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </main>
  <script>
    const scenes = [
      { icon: "📚", title: "Safe, Smart, Ready", text: "A few simple habits help everyone feel welcome and safe in our school library. Let’s get started." },
      { icon: "🚪", title: "Know where to go", text: "Notice the nearest exits when you arrive. Keep doorways and walkways clear so everyone can move safely." },
      { icon: "🎒", title: "Look after your things", text: "Keep your bag, books, and devices with you or in the places your school provides. Don’t leave valuables unattended." },
      { icon: "🤝", title: "Make room for everyone", text: "Use a calm voice, respect personal space, and treat people and library materials with care." },
      { icon: "🙋", title: "Speak up safely", text: "If something feels unsafe, tell the librarian, teacher, or another trusted school adult. Share what you noticed—don’t investigate or confront anyone." },
      { icon: "🧑‍🏫", title: "Follow staff directions", text: "If there’s an alarm or emergency, stay calm, listen to school staff, and follow the school’s safety plan. Leave belongings behind if asked to evacuate." },
      { icon: "💚", title: "We keep it safe together", text: "Be aware, be kind, and ask for help when you need it. A safe library is a place where everyone can learn." }
    ];
    const title = document.getElementById("title");
    const caption = document.getElementById("caption");
    const art = document.getElementById("art");
    const eyebrow = document.getElementById("eyebrow");
    const count = document.getElementById("sceneCount");
    const bar = document.getElementById("progress");
    const track = document.querySelector(".progress-track");
    const playButton = document.getElementById("play");
    const audioButton = document.getElementById("audio");
    const status = document.getElementById("status");
    let index = 0;
    let timer = null;
    let narration = false;
    const sceneDuration = 6500;

    function showScene(nextIndex) {
      index = Math.max(0, Math.min(scenes.length - 1, nextIndex));
      const scene = scenes[index];
      art.textContent = scene.icon;
      title.textContent = scene.title;
      caption.textContent = scene.text;
      eyebrow.textContent = index === 0 ? "A quick safety guide" : "School library safety";
      count.textContent = `Scene ${index + 1} of ${scenes.length}`;
      const percent = Math.round(((index + 1) / scenes.length) * 100);
      bar.style.width = `${percent}%`;
      track.setAttribute("aria-valuenow", String(percent));
      status.textContent = `Scene ${index + 1}: ${scene.title}. ${scene.text}`;
      if (narration && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(`${scene.title}. ${scene.text}`));
      }
    }
    function stop() {
      clearInterval(timer);
      timer = null;
      playButton.textContent = "▶ Play";
      playButton.setAttribute("aria-label", "Play video");
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    }
    function play() {
      if (timer) { stop(); return; }
      if (index === scenes.length - 1) showScene(0);
      playButton.textContent = "❚❚ Pause";
      playButton.setAttribute("aria-label", "Pause video");
      if (narration && "speechSynthesis" in window) {
        const scene = scenes[index];
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(`${scene.title}. ${scene.text}`));
      }
      timer = setInterval(() => {
        if (index >= scenes.length - 1) { stop(); return; }
        showScene(index + 1);
      }, sceneDuration);
    }
    document.getElementById("back").addEventListener("click", () => { stop(); showScene(index - 1); });
    document.getElementById("next").addEventListener("click", () => { stop(); showScene(index + 1); });
    playButton.addEventListener("click", play);
    audioButton.addEventListener("click", () => {
      narration = !narration;
      audioButton.textContent = narration ? "🔊 Narration on" : "🔊 Narration off";
      audioButton.setAttribute("aria-pressed", String(narration));
      if (!narration && "speechSynthesis" in window) window.speechSynthesis.cancel();
      else if (narration) showScene(index);
    });
    document.addEventListener("keydown", event => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.key === "ArrowRight") { stop(); showScene(index + 1); }
      if (event.key === "ArrowLeft") { stop(); showScene(index - 1); }
      if (event.key === " " && event.target.tagName !== "BUTTON") { event.preventDefault(); play(); }
    });
    showScene(0);
  </script>
</body>
</html>
