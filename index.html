<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Security Camera</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display:grid; place-items:center; background:#090d12; font-family:system-ui,sans-serif; color:#d9e5df; }
    main { width:min(92vw,960px); }
    .header { display:flex; justify-content:space-between; align-items:center; margin:0 0 .6rem; font-size:.85rem; letter-spacing:.08em; text-transform:uppercase; }
    .rec { color:#ff6b62; } .rec::before { content:""; display:inline-block; width:.7rem; height:.7rem; margin-right:.45rem; border-radius:50%; background:#ed554d; box-shadow:0 0 12px #ed554d; }
    .camera {
      position:relative; overflow:hidden; aspect-ratio:16/9; border:8px solid #20272c; border-radius:8px;
      background:linear-gradient(90deg,#0a0f0d 0 12%,#26352f 12% 32%,#4a6254 32% 65%,#1b2923 65% 100%);
      filter:contrast(.78) saturate(.55) brightness(.72); box-shadow:0 0 40px #000;
    }
    .timestamp { position:absolute; z-index:20; top:14px; left:18px; font:700 clamp(.7rem,2vw,1.1rem) monospace; text-shadow:1px 1px #000; }
    .corner { position:absolute; z-index:20; width:38px; height:38px; border-color:#a4bbb0; opacity:.7; }
    .tl { top:12px; left:12px; border-top:2px solid; border-left:2px solid; } .tr { top:12px; right:12px; border-top:2px solid; border-right:2px solid; } .bl { bottom:12px; left:12px; border-bottom:2px solid; border-left:2px solid; } .br { bottom:12px; right:12px; border-bottom:2px solid; border-right:2px solid; }
    .building { position:absolute; left:0; top:0; bottom:28%; width:34%; background:linear-gradient(135deg,#1b2421,#46564c); clip-path:polygon(0 0,100% 12%,100% 100%,0 100%); box-shadow:12px 0 25px #0a100d; }
    .window { position:absolute; width:17%; height:38%; left:8%; top:16%; background:#0d1713; border:5px solid #586a60; box-shadow:inset 0 0 25px #000; }
    .door { position:absolute; width:22%; height:55%; right:-2%; top:24%; background:#17201d; border:4px solid #68786f; }
    .shadow { position:absolute; z-index:4; width:20%; height:11%; left:27%; top:47%; border-radius:50%; background:#060807; filter:blur(5px); transform:rotate(-8deg); opacity:.95; }
    .road { position:absolute; left:0; right:0; bottom:0; height:29%; background:linear-gradient(170deg,#526258,#252e29 80%); }
    .garden { position:absolute; right:-3%; bottom:-3%; width:42%; height:34%; background:#18251b; clip-path:polygon(14% 100%,32% 32%,100% 0,100% 100%); }
    .plant { position:absolute; bottom:20%; width:2.5%; height:18%; border-radius:50%; background:#41583d; }
    .plant::before,.plant::after { content:""; position:absolute; width:170%; height:55%; border-radius:100% 0; background:#64785a; transform-origin:left bottom; }
    .plant::before { left:-10%; bottom:45%; transform:rotate(-35deg); } .plant::after { right:-80%; bottom:30%; transform:rotate(25deg) scaleX(-1); }
    .mouse { position:absolute; z-index:8; left:-12%; bottom:19%; width:55px; height:30px; border-radius:55% 45% 48% 52%; background:#8c9991; filter:drop-shadow(3px 5px 2px #111); animation:mouseCross 12s linear infinite; }
    .mouse::before { content:""; position:absolute; right:-18px; top:5px; width:22px; height:22px; border-radius:50%; background:#9aa49e; box-shadow:4px -7px 0 -5px #738078; }
    .mouse::after { content:""; position:absolute; left:-28px; top:15px; width:31px; height:8px; border-radius:50%; border-top:3px solid #9aa49e; transform:rotate(-12deg); }
    .shine { position:absolute; z-index:9; width:14px; height:14px; left:-5px; top:5px; transform:rotate(45deg); background:#fff8ad; box-shadow:0 0 12px 5px #e8ef9c; animation:spark 1s steps(2) infinite; }
    .person { position:absolute; z-index:7; right:-18%; bottom:10%; width:70px; height:145px; animation:personWalk 16s 2s linear infinite; }
    .hat { position:absolute; z-index:3; left:-16px; top:-20px; width:102px; height:25px; border-radius:50%; background:#161d1a; box-shadow:0 8px 0 2px #29312d; }
    .head { position:absolute; top:4px; left:23px; width:34px; height:38px; border-radius:45%; background:#30352f; }
    .body { position:absolute; top:38px; left:7px; width:56px; height:82px; border-radius:18px 18px 8px 8px; background:#303b35; }
    .leg { position:absolute; bottom:0; width:15px; height:34px; background:#202724; } .leg.left { left:13px; } .leg.right { right:12px; }
    .scanlines { position:absolute; z-index:30; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px); mix-blend-mode:screen; }
    .noise { position:absolute; z-index:31; inset:0; pointer-events:none; opacity:.12; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E"); }
    .controls { display:flex; align-items:center; gap:.75rem; margin-top:.8rem; }
    button { min-height:44px; border:1px solid #46534d; border-radius:8px; background:#1c2420; color:#eef7f1; padding:.6rem 1rem; font:700 1rem system-ui; cursor:pointer; }
    button:focus-visible { outline:3px solid #d6b74b; outline-offset:3px; }
    .status { margin-left:auto; color:#83958d; font-size:.9rem; }
    @keyframes mouseCross { 0%,10% { left:-12%; } 72%,100% { left:78%; } }
    @keyframes personWalk { 0%,15% { right:-18%; } 80%,100% { right:52%; } }
    @keyframes spark { 50% { filter:brightness(1.8); transform:rotate(45deg) scale(.7); } }
    @media (prefers-reduced-motion:reduce) { .mouse,.person,.shine { animation-play-state:paused; } }
  </style>
</head>
<body>
  <main>
    <div class="header"><span>LIBRARY • Camera 02 • East entrance</span><span class="rec">Recording</span></div>
    <div class="camera" id="camera" role="img" aria-label="Security camera view of the school library entrance: a shadow near the building, a mouse carrying a shiny object, and a person in a large hat walking toward the garden">
      <span class="timestamp" id="timestamp">NOV 18 2026  18:42:09</span>
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div class="building"><div class="window"></div><div class="door"></div></div>
      <div class="shadow"></div>
      <div class="road"></div>
      <div class="garden"></div>
      <i class="plant" style="right:28%"></i><i class="plant" style="right:12%;height:24%"></i><i class="plant" style="right:4%;height:15%"></i>
      <div class="mouse" id="mouse"><div class="shine"></div></div>
      <div class="person" id="person"><div class="hat"></div><div class="head"></div><div class="body"></div><div class="leg left"></div><div class="leg right"></div></div>
      <div class="scanlines"></div><div class="noise"></div>
    </div>
    <div class="controls">
      <button id="play" type="button" aria-label="Play security clip">▶ Play</button>
      <button id="rewind" type="button" aria-label="Restart security clip">↶ Restart</button>
      <span class="status" id="status">Clip paused — 0:00 / 0:16</span>
    </div>
  </main>
  <script>
    const camera=document.getElementById('camera'), mouse=document.getElementById('mouse'), person=document.getElementById('person'), play=document.getElementById('play'), rewind=document.getElementById('rewind'), status=document.getElementById('status'), timestamp=document.getElementById('timestamp');
    let running=false, seconds=0, timer=null;
    function setMotion(playState){ [mouse,person].forEach(el=>{el.style.animationPlayState=playState?'running':'paused'}); }
    function format(n){return `0:${String(n).padStart(2,'0')}`}
    function start(){
      if(running){clearInterval(timer);running=false;play.textContent='▶ Play';play.setAttribute('aria-label','Play security clip');setMotion(false);status.textContent=`Clip paused — ${format(seconds)} / 0:16`;return}
      running=true;play.textContent='❚❚ Pause';play.setAttribute('aria-label','Pause security clip');setMotion(true);
      timer=setInterval(()=>{seconds++; if(seconds>=16){clearInterval(timer);running=false;seconds=16;play.textContent='↻ Replay';setMotion(false);status.textContent='Clip ended — 0:16 / 0:16';return}status.textContent=`Clip playing — ${format(seconds)} / 0:16`},1000);
    }
    function restart(){clearInterval(timer);seconds=0;running=false;play.textContent='▶ Play';status.textContent='Clip paused — 0:00 / 0:16';setMotion(false);mouse.style.animation='none';person.style.animation='none';void camera.offsetWidth;mouse.style.animation='mouseCross 12s linear infinite';person.style.animation='personWalk 16s 2s linear infinite';}
    play.addEventListener('click',start);rewind.addEventListener('click',restart);
    setInterval(()=>{const d=new Date(2026,10,18,18,42,9+seconds);const pad=n=>String(n).padStart(2,'0');timestamp.textContent=`NOV 18 2026  ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`},1000);
    setMotion(false);
  </script>
</body>
</html>
